<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<style>
:root{--gold:#ffe78a;--ink:#251332;--ease:cubic-bezier(.65,0,.35,1)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{overflow:hidden;color:#fff;font-family:'Fredoka',system-ui,Arial,sans-serif;background:#0b0920}

/* ---------- Camera + world ---------- */
.camera{position:absolute;inset:0;overflow:hidden;perspective:1400px;background:#0b0920}
.world{position:absolute;inset:0;transform-origin:50% 100%;transition:transform 3.8s var(--ease);
 background:
  radial-gradient(ellipse 70% 40% at 50% 100%,rgba(230,120,200,.42),transparent 70%),
  radial-gradient(circle at 78% 18%,rgba(150,110,230,.30),transparent 28%),
  linear-gradient(to bottom,#07061a 0%,#12103a 28%,#2a1b5c 52%,#59307a 72%,#a0488e 88%,#d7739f 100%)}
body.opened .world{transform:scale(1.22) rotateY(-8deg)}
.stars{position:absolute;inset:0 -5% 40% -5%;transition:transform 3.8s var(--ease);
 background-image:radial-gradient(circle,#fff 0 1px,transparent 1.6px),radial-gradient(circle,#d8c8ff 0 1px,transparent 1.6px),radial-gradient(circle,#fff 0 .8px,transparent 1.3px);
 background-size:97px 97px,163px 163px,59px 59px;background-position:11px 17px,70px 40px,30px 5px;
 opacity:.7;animation:twinkle 5s ease-in-out infinite alternate}
body.opened .stars{transform:translateX(-2vw)}
.moon{position:absolute;top:9%;right:12%;width:clamp(64px,10vw,104px);aspect-ratio:1;border-radius:50%;transition:transform 3.8s var(--ease);
 background:radial-gradient(circle at 35% 32%,#fffdf0 0 20%,#efe6ff 58%,#c7b6ea 100%);
 box-shadow:0 0 30px rgba(238,222,255,.8),0 0 110px 20px rgba(170,126,230,.35)}
body.opened .moon{transform:translateX(-5vw)}
.rig{position:absolute;top:0;bottom:0;left:-12.5%;width:125%;transition:transform 3.8s var(--ease)}
body.opened .rig{transform:translateX(-10%)}
.rig canvas{position:absolute;inset:0;width:100%;height:100%}
.cityglow{position:absolute;left:0;right:0;bottom:0;height:45%;pointer-events:none;mix-blend-mode:screen;
 background:linear-gradient(to top,rgba(255,130,200,.28),transparent);animation:breathe 6s ease-in-out infinite alternate}
.blink{position:absolute;width:5px;height:5px;border-radius:50%;background:#ff4d6d;box-shadow:0 0 10px #ff4d6d;animation:win 1.8s ease-in-out infinite}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(8,5,22,.45))}

/* ---------- Pages (camera-rotation swap) ---------- */
.stage{position:absolute;inset:0;z-index:20;perspective:1400px;overflow:hidden}
.page{backface-visibility:hidden;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
 padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));
 transition:opacity .6s ease,transform 1.6s var(--ease),visibility 0s}
.page.off{opacity:0;visibility:hidden;pointer-events:none;
 transition:opacity 1s ease .2s,transform 1.6s var(--ease),visibility 0s 1.6s}
#start.off{transform:rotateY(180deg)}
#gift.off{transform:rotateY(-180deg)}

.hello{font-size:clamp(17px,4.4vw,24px);color:#f1e6ff;margin:0;text-shadow:0 2px 6px #080611,0 0 14px rgba(205,145,255,.8)}
h1{margin:6px 0 8px;font-weight:600;font-size:clamp(32px,9vw,68px);line-height:1.02;color:var(--gold);
 text-shadow:0 2px 3px rgba(0,0,0,.6),0 0 10px rgba(255,244,190,.85),0 0 32px rgba(255,187,83,.55)}
.sub{font-size:clamp(17px,4.6vw,26px);color:#f4ecff;margin:0 0 10px;text-shadow:0 2px 4px #080611,0 0 12px rgba(205,145,255,.8)}
.msg{max-width:560px;margin:4px auto 16px;font-size:clamp(16px,4.2vw,23px);line-height:1.5;color:#fff7dc;
 text-shadow:0 2px 4px rgba(0,0,0,.75),0 0 12px rgba(126,66,166,.8)}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;font:600 18px 'Fredoka',system-ui,sans-serif;cursor:pointer;border:1px solid var(--gold);border-radius:999px;padding:13px 30px;color:var(--ink);
 background:linear-gradient(135deg,#ffe78a,#ffd05d);box-shadow:0 0 18px rgba(255,224,114,.6),0 8px 25px rgba(0,0,0,.45);transition:transform .2s}
button:hover{transform:translateY(-2px)}button:active{transform:scale(.95)}
button:focus-visible{outline:3px solid #fff;outline-offset:6px}

/* ---------- Pixel gift button ---------- */
.giftbtn{position:relative;background:none;border:0;box-shadow:none;padding:6px;border-radius:12px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:10px}
.giftbtn:hover{transform:none}
.giftbtn .spr{width:clamp(86px,17vh,140px);filter:drop-shadow(0 0 22px rgba(255,130,220,.7)) drop-shadow(0 10px 14px rgba(0,0,0,.45));animation:pbob 1.1s infinite}
.giftbtn.shake .spr{animation:shake .55s steps(2) both}
.giftbtn span.cap{font-size:clamp(16px,4vw,20px);text-shadow:0 2px 4px #080611,0 0 12px rgba(205,145,255,.9);animation:pulse 1.6s ease-in-out infinite}
.spark{position:absolute;width:18px;animation:spark 1.6s steps(2) infinite}

/* ---------- Pixel bear ---------- */
.bearwrap{position:relative;display:inline-block}
.bear{width:clamp(130px,29vh,210px);height:auto;display:block;overflow:visible;animation:pbob 1s infinite;filter:drop-shadow(0 10px 16px rgba(0,0,0,.45))}
.armA{animation:fa 1s steps(1) infinite}.armB{animation:fa 1s steps(1) infinite reverse}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 3.6s steps(1) infinite}
.heart{position:absolute;width:18px;opacity:0;animation:heart 3.4s steps(8) infinite}
.rise{opacity:1}
#gift.in .rise{animation:rise 1s cubic-bezier(.22,1,.36,1) var(--d,0s) both}

.confetti{position:absolute;z-index:40;top:-20px;width:8px;height:8px;pointer-events:none;animation:fall linear 2 both}

@keyframes twinkle{from{opacity:.45}to{opacity:.8}}
@keyframes breathe{from{opacity:.35}to{opacity:1}}
@keyframes win{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes pbob{0%,49%{transform:none}50%,100%{transform:translateY(-6px)}}
@keyframes fa{0%{opacity:1}50%{opacity:0}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.15)}}
@keyframes shake{0%{transform:rotate(0)}25%{transform:rotate(-8deg) scale(1.06)}50%{transform:rotate(8deg) scale(1.1)}75%{transform:rotate(-6deg) scale(1.12)}100%{transform:rotate(0) scale(1.15)}}
@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
@keyframes spark{0%,100%{opacity:0}50%{opacity:1}}
@keyframes heart{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-80px)}}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes fall{from{transform:translateY(-20px) rotate(0)}to{transform:translateY(112vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}

/* ---------- Falling cake intro ---------- */
.cake{width:clamp(120px,24vh,200px);height:auto;overflow:visible;margin-bottom:4px;filter:drop-shadow(0 0 18px rgba(255,155,220,.45))}
.js .L{opacity:0;transform-box:fill-box;transform-origin:50% 100%}
.js .flames{opacity:0}
.fl{transform-box:fill-box;transform-origin:50% 100%;filter:drop-shadow(0 0 5px #ffb347);animation:flick .35s ease-in-out infinite alternate}
.js #start .seq{opacity:0}
.js #start.play .seq{animation:rise 1s cubic-bezier(.22,1,.36,1) var(--d) both}
#start.play .L{animation:drop 1.1s linear calc(var(--i)*.45s + .2s) both}
#start.play .flames{animation:fadein .6s ease 3.15s both}

body.opened .mute{opacity:1;pointer-events:auto;transition:opacity .6s 3.2s}
@keyframes drop{
 0%{opacity:0;transform:translateY(-340px);animation-timing-function:cubic-bezier(.55,0,.9,.55)}
 6%{opacity:1}
 60%{opacity:1;transform:translateY(0) scale(1.05,.9);animation-timing-function:ease-out}
 80%{transform:translateY(-9px) scale(.99,1.03);animation-timing-function:ease-in}
 100%{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.12) rotate(3deg)}}

.js #start.settled .seq{opacity:1;animation:none}
.js #start.settled .L{opacity:1;animation:none;transform:none}
.js #start.settled .flames{opacity:1;animation:none}
#gate{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;
 background:radial-gradient(circle,rgba(20,12,50,.35),rgba(8,5,22,.8));transition:opacity .7s ease}

 /* ---------- Bear walks in, hops, then the message appears ---------- */
.js #gift .bearwrap{transform:translateX(-80vw)}

.bearwrap::after{content:'';position:absolute;left:18%;right:18%;bottom:-2px;height:10px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(4px);z-index:-1}
.bear{transform-origin:50% 100%}
.fA,.fB{opacity:0}
.walk .fS{opacity:0}
.walk .fA{opacity:1;animation:fa .62s steps(1) infinite}
.walk .fB{opacity:1;animation:fa .62s steps(1) infinite reverse}

.walk .armA,.jump .armB{animation:none;opacity:1}
.walk .armB,.jump .armA{animation:none;opacity:0}

.js #gift .txt{opacity:0}
.js #gift.msgin .txt{animation:rise 1s cubic-bezier(.22,1,.36,1) var(--d,0s) both}
.fallback #gift .txt{opacity:1!important;animation:none!important}
@keyframes walkin{from{transform:translateX(-80vw)}to{transform:none}}
@keyframes wbob{0%{transform:translateY(0) rotate(-2.5deg)}50%{transform:translateY(-5px) rotate(2.5deg)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.1,.88)}15%{transform:translateY(0) scale(.96,1.06)}50%{transform:translateY(-6.5vh) scale(.97,1.05)}85%{transform:translateY(0) scale(1,1)}}
@keyframes shade{50%{transform:scale(.55);opacity:.5}}
#gate{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;
 background:radial-gradient(circle,rgba(20,12,50,.35),rgba(8,5,22,.8));transition:opacity .7s ease}
#gate.gone{opacity:0;pointer-events:none}
#gate .gemoji{font-size:72px;animation:pbob 1.2s infinite}
#gate p{margin:6px 0 18px;font-size:clamp(17px,4.6vw,22px);color:#f4ecff;text-shadow:0 2px 4px #080611}
 
 /* ---------- Safety net: if scripts fail, still show everything ---------- */
.skyline{display:none;position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(#2a1b4d,#0d0922);
 -webkit-clip-path:polygon(0 60%,5% 60%,5% 30%,11% 30%,11% 55%,17% 55%,17% 15%,24% 15%,24% 50%,30% 50%,30% 35%,38% 35%,38% 62%,45% 62%,45% 20%,52% 20%,52% 48%,60% 48%,60% 28%,67% 28%,67% 58%,74% 58%,74% 10%,81% 10%,81% 45%,88% 45%,88% 33%,95% 33%,95% 55%,100% 55%,100% 100%,0 100%);
 clip-path:polygon(0 60%,5% 60%,5% 30%,11% 30%,11% 55%,17% 55%,17% 15%,24% 15%,24% 50%,30% 50%,30% 35%,38% 35%,38% 62%,45% 62%,45% 20%,52% 20%,52% 48%,60% 48%,60% 28%,67% 28%,67% 58%,74% 58%,74% 10%,81% 10%,81% 45%,88% 45%,88% 33%,95% 33%,95% 55%,100% 55%,100% 100%,0 100%)}
.nocity .skyline{display:block}
.fallback .L,.fallback .flames,.fallback #start .seq{opacity:1!important;animation:none!important}
.fallback .giftbtn{pointer-events:auto}
.camera,.stage{position:fixed}
.moon{height:clamp(64px,10vw,104px)}
.page{-webkit-backface-visibility:hidden}
</style>
</head>

<script>
/* ---------- Time-aware greetings ---------- */
function moment(){
  const h=new Date().getHours();
  if(h>=1&&h<12)  return {hello:"Good morning, Risie 😆🥰🥳",   sub:"Today is all about you ✨",        wish:"Though hindi kita kayang kausapin in personal hehe😅😆, I just want to tell you happy birthday🥳🎂❤️, and I hope you appreciate this :) -∆-.  -jaow"};
  if(h>=12&&h<18) return {hello:"Good afternoon, Risie 😆🥰🥳", sub:"Today is all about you ✨",        wish:"Though hindi kita kayang kausapin in personal hehe😅😆, I just want to tell you happy birthday🥳🎂❤️, and I hope you appreciate this :) -∆-.  -jaow"};
  return {hello:"Good evening, Risie 😆🥰🥳",   sub:"Tonight is all about you ✨",      wish:"Though hindi kita kayang kausapin in personal hehe😅😆, I just want to tell you happy birthday🥳🎂❤️, and I hope you appreciate this :) -∆-.  -jaow"};
 }
function applyGreeting(){
  const m=moment();
  document.querySelectorAll('[data-hello]').forEach(e=>e.textContent=m.hello);
  document.querySelectorAll('[data-sub]').forEach(e=>e.textContent=m.sub);
  document.querySelectorAll('[data-wish]').forEach(e=>e.textContent=m.wish);
}
applyGreeting();

<script>
/* ---------- Tiny pixel-art engine ---------- */
function Pix(w,h){
  const g=Array.from({length:h},()=>Array(w).fill(null));
  const p={
    set(x,y,c){if(x>=0&&y>=0&&x<w&&y<h)g[y][x]=c},
    rect(x,y,a,b,c){for(let j=0;j<b;j++)for(let i=0;i<a;i++)p.set(x+i,y+j,c)},
    ell(cx,cy,rx,ry,c){for(let y=0;y<h;y++)for(let x=0;x<w;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)g[y][x]=c}},
    outline(c){const o=[];for(let y=0;y<h;y++)for(let x=0;x<w;x++)
      if(!g[y][x]&&[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>g[y+b]&&g[y+b][x+a]))o.push([x,y]);
      o.forEach(([x,y])=>g[y][x]=c)},
    rects(pal){let s='';for(let y=0;y<h;y++){let x=0;while(x<w){const c=g[y][x];if(!c){x++;continue}
      let n=1;while(x+n<w&&g[y][x+n]===c)n++;s+=`<rect x="${x}" y="${y}" width="${n}" height="1" fill="${pal[c]}"/>`;x+=n}}return s},
    svg(pal,cls){return `<svg class="${cls||''}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" aria-hidden="true">${p.rects(pal)}</svg>`}
  };return p;
}

<script>
/* Teddy bear */
(function(){
  const pal={o:'#4a2a1b',b:'#cf8f5d',d:'#b87548',l:'#efc194',p:'#ff8fb8',n:'#2b1810',m:'#ff82d8',y:'#ffe78a',h:'#9f8cff',e:'#2b1810'};
  const W=36,H=40,B=Pix(W,H);
    B.ell(9,8,4,4,'b');B.ell(25,8,4,4,'b');B.ell(9,8,2,2,'l');B.ell(25,8,2,2,'l'); // ears
  B.ell(17,29,10,8,'b');B.ell(17,31,6,5,'l');                       // body + belly
  B.ell(17,16,11,9,'b');B.ell(17,19,5,3,'l');                       // head + muzzle

  B.rect(8,18,3,2,'p');B.rect(23,18,3,2,'p');                       // cheeks
  B.rect(11,24,5,3,'m');B.rect(18,24,5,3,'m');B.rect(16,24,2,3,'y'); // bow tie
  B.rect(16,1,2,2,'m');for(let i=0;i<5;i++)B.rect(17-(1+i),3+i,2+2*i,1,i==2?'y':'h'); // party hat
  B.rect(2,27,9,8,'h');B.rect(6,27,1,8,'y');B.rect(2,30,9,1,'y');B.rect(3,25,3,2,'m');B.rect(7,25,3,2,'m'); // gift
  B.ell(8,32,3,4.5,'b');                                            // left arm hugging gift
  B.outline('o');
  const FS=Pix(W,H);FS.ell(10,37,4,2,'d');FS.ell(24,37,4,2,'d');FS.outline('o');
  const FA=Pix(W,H);FA.ell(10,35,4,2,'d');FA.ell(24,37,4,2,'d');FA.outline('o');

  const R=Pix(W,H);R.ell(30,20,3,6,'b');R.ell(30,15,2,1.5,'l');R.outline('o');
  const E=Pix(W,H);E.rect(12,14,2,3,'e');E.rect(20,14,2,3,'e');
  const heart=(()=>{const h=Pix(9,8);h.rect(1,0,3,1,'m');h.rect(5,0,3,1,'m');h.rect(0,1,9,3,'m');h.rect(1,4,7,1,'m');h.rect(2,5,5,1,'m');h.rect(3,6,3,1,'m');h.rect(4,7,1,1,'m');return h.svg(pal,'heart')})();

   `<svg class="bear" viewBox="0 0 ${W} ${H}" shape-rendering="crispEdges" role="img" aria-label="A pixel teddy bear holding a gift and waving">
     <g class="fS">${FS.rects(pal)}</g><g class="fA">${FA.rects(pal)}</g><g class="fB">${FB.rects(pal)}</g>${B.rects(pal)}<g class="armA">${A.rects(pal)}</g><g class="armB">${R.rects(pal)}</g><g class="eyes">${E.rects(pal)}</g></svg>`;

<script>
/* ---------- Layered city with twinkling windows ---------- */
const cv=document.getElementById('city'),ctx=cv.getContext('2d'),wc=document.getElementById('wins'),wx=wc.getContext('2d'),lights=document.getElementById('lights');
let wins=[],CW=0,CH=0;
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function rng(s){return()=>(s=s*16807%2147483647)/2147483647}
function drawCity(){
  const dpr=Math.min(devicePixelRatio||1,2),W=innerWidth*1.25,H=innerHeight;CW=W;CH=H;
  [cv,wc].forEach(c=>{c.width=W*dpr;c.height=H*dpr});
  ctx.setTransform(dpr,0,0,dpr,0,0);wx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  lights.innerHTML='';wins=[];
  const sc=Math.max(.7,Math.min(1.3,innerWidth/900));
  const layers=[
    {seed:11,min:.14,max:.34,w:[34,80],top:'#5b3f8f',bot:'#8a4d95',win:0,  k:0,  fog:.30},
    {seed:23,min:.10,max:.27,w:[30,70],top:'#3a2a6b',bot:'#5a3478',win:.12,k:.5, fog:.26},
    {seed:37,min:.06,max:.20,w:[28,64],top:'#1c1440',bot:'#2c1a4d',win:.28,k:.8, fog:.18},
    {seed:51,min:.03,max:.12,w:[34,90],top:'#0d0922',bot:'#140c2b',win:.38,k:1,  fog:0}
  ];
  layers.forEach((L,li)=>{
    const r=rng(L.seed);let x=-20;
    while(x<W){
      const bw=(L.w[0]+r()*(L.w[1]-L.w[0]))*sc,bh=H*(L.min+r()*(L.max-L.min)),y=H-bh;
      const g=ctx.createLinearGradient(0,y,0,H);g.addColorStop(0,L.top);g.addColorStop(1,L.bot);ctx.fillStyle=g;ctx.fillRect(x,y,bw+1,bh);
      if(r()<.3){const tw=bw*(.4+r()*.3),th=8+r()*22;ctx.fillRect(x+(bw-tw)/2,y-th,tw,th)}
      if(r()<.2){ctx.fillRect(x+bw/2-1,y-24-r()*18,2,40)}
      ctx.fillStyle='rgba(255,190,240,.07)';ctx.fillRect(x+bw*.82,y,bw*.18,bh);
      if(L.win){const cw=9*sc,ch=13*sc;
        for(let wy=y+10;wy<H-8;wy+=ch)for(let wx2=x+6;wx2<x+bw-8;wx2+=cw)if(r()<L.win)
          wins.push({x:wx2,y:wy,w:3.2*sc,h:5*sc,k:L.k,s:.3+r()*1.4,p:r()*6.28,c:r()<.8?'#ffd678':'#ffa0dc'});
      }
      if(li===3&&r()<.3&&lights.childElementCount<14){
        const d=document.createElement('i');d.className='blink';d.style.left=(x+r()*bw)+'px';d.style.top=(y+6)+'px';d.style.animationDelay=(r()*2)+'s';lights.appendChild(d);
      }
      x+=bw+(r()<.3?4:0);
    }
    if(L.fog){const f=ctx.createLinearGradient(0,H*.55,0,H);f.addColorStop(0,'rgba(215,115,190,0)');f.addColorStop(1,`rgba(215,115,190,${L.fog})`);ctx.fillStyle=f;ctx.fillRect(0,H*.55,W,H*.45)}
  });
  renderWins(0);
}
function renderWins(t){
  wx.clearRect(0,0,CW,CH);
  for(const w of wins){
    wx.globalAlpha=w.k*(still?.8:.12+.88*(.5+.5*Math.sin(t*w.s+w.p)));
    wx.fillStyle=w.c;wx.fillRect(w.x,w.y,w.w,w.h);
  }
  wx.globalAlpha=1;
}
let last=0;function loop(ms){if(ms-last>66){last=ms;renderWins(ms/1000)}requestAnimationFrame(loop)}
drawCity();window.__city=1;if(!still)requestAnimationFrame(loop);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(drawCity,150)});

</script>
<script>
/* ---------- Music: cheerful buzzy "Happy Birthday" loop (Web Audio) ---------- */
const Music=(()=>{
  let a,master,timer,on=false,muted=false,noise;
  const beat=.4,len=24*beat,F={G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99};
  const mel=[['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
             ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',1],['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2]];
  const C=[130.8,[261.6,329.6,392]],G=[98,[246.9,293.7,392]],Fm=[87.3,[220,261.6,349.2]],bars=[C,G,G,C,C,Fm,Fm,C];
  function tone(f,t,d,type,vol,det,lp){
    const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;o.detune.value=det||0;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    let n=o;if(lp){const q=a.createBiquadFilter();q.type='lowpass';q.frequency.value=lp;o.connect(q);n=q}
    n.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);
  }
  function hat(t,v){const s=a.createBufferSource(),h=a.createBiquadFilter(),g=a.createGain();s.buffer=noise;h.type='highpass';h.frequency.value=7000;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);s.connect(h);h.connect(g);g.connect(master);s.start(t);s.stop(t+.06)}
  function schedule(t0){
    let t=t0;mel.forEach(([n,b])=>{const d=Math.max(b*beat*.9,.12);
      tone(F[n],t,d,'sawtooth',.045,-7,2600);tone(F[n],t,d,'sawtooth',.045,7,2600);tone(F[n]*2,t,d*.6,'triangle',.02,0);t+=b*beat});
    bars.forEach(([root,ch],i)=>{const bt=t0+i*3*beat;
      tone(root,bt,beat*.9,'triangle',.26,0);
      [1,2].forEach(k=>ch.forEach(f=>tone(f,bt+k*beat,beat*.5,'square',.018,0,1800)));});
    for(let i=0;i<48;i++)hat(t0+i*beat/2,i%2?.012:.025);
  }
  function loop(t){schedule(t);timer=setTimeout(()=>loop(t+len),(len-1.2)*1000)}
  return{
    start(){if(on)return;try{const A=window.AudioContext||window.webkitAudioContext;a=new A();master=a.createGain();master.gain.value=muted?0:.8;master.connect(a.destination);
      noise=a.createBuffer(1,a.sampleRate*.1,a.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      on=true;if(a.state==='suspended')a.resume();loop(a.currentTime+.1)}catch(e){on=false}},
    stop(){if(!on)return;on=false;clearTimeout(timer);const c=a;master.gain.setTargetAtTime(0,c.currentTime,.2);setTimeout(()=>c.close(),900)},
    toggle(){muted=!muted;if(on)master.gain.setTargetAtTime(muted?0:.8,a.currentTime,.1);return muted}
  };
})();

</script>
<script>
/* ---------- Natural foley-style sound effects (no beeps, no pitch sweeps) ---------- */
const Sfx=(()=>{
  let a,white,brown,m;
  function unlock(){try{
    if(!a){const A=window.AudioContext||window.webkitAudioContext;a=new A();m=a.createGain();m.gain.value=1;m.connect(a.destination);
      const n=a.sampleRate*2|0;white=a.createBuffer(1,n,a.sampleRate);brown=a.createBuffer(1,n,a.sampleRate);
      const w=white.getChannelData(0),b=brown.getChannelData(0);let last=0,mx=0;
      for(let i=0;i<n;i++){w[i]=Math.random()*2-1;last=(last+.02*w[i])/1.02;b[i]=last;mx=Math.max(mx,Math.abs(last))}
      for(let i=0;i<n;i++)b[i]/=mx}
    if(a.state==='suspended')a.resume()}catch(e){a=null}}
  const running=()=>!!a&&a.state==='running';
  function ready(fn){if(!a){fn();return}try{a.resume().then(fn,fn)}catch(e){fn()}}
  function env(g,t,v,att,dur){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur)}
  // filtered noise burst
  function nz(t,dur,type,f0,f1,v,q,buf,att){const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
    s.buffer=buf||white;s.loop=true;s.loopStart=0;f.type=type;f.Q.value=q||.7;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
    env(g,t,v,att||Math.min(.02,dur/3),dur);s.connect(f);f.connect(g);g.connect(m);s.start(t,Math.random());s.stop(t+dur+.05)}
  // ceramic "tink": a few inharmonic partials, fast decay
  function tink(t,v){[2700,4150,5480,7300].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f*(1+Math.random()*.01);
    env(g,t,v/(i+1.4),.002,.07+.09/(i+1));o.connect(g);g.connect(m);o.start(t);o.stop(t+.25)});nz(t,.015,'highpass',5000,9000,v*.5,1)}
  return{unlock,running,ready,
    steps(){ if(!running())return; const now=a.currentTime+.05;                    // soft footsteps
      for(let i=0;i<7;i++){const t=now+.1+i*.31;nz(t,.09,'lowpass',420,110,.3+(i%2)*.08,.6,brown,.004);nz(t,.03,'bandpass',1500,900,.04,1)}},
    hops(){ if(!running())return; const now=a.currentTime+.05;                     // three soft landings
      for(let k=0;k<3;k++){const t=now+.45+k*.55;nz(t,.24,'lowpass',380,70,.7,.6,brown,.003);nz(t+.01,.1,'lowpass',1300,300,.16,.7,white,.003)}},
    intro(){ if(!running())return; const now=a.currentTime+.05;      // same timeline as the CSS animation
      for(let i=0;i<5;i++){
        const fall=now+i*.45+.2,land=fall+.66;
        nz(fall+.1,.5,'bandpass',900,350,.035,.5);                                   // faint air rush
        if(i===0){tink(land,.1);nz(land,.05,'bandpass',1500,900,.08,1)}              // plate sets down
        else if(i<4){const w=[0,1,.82,.66][i];
          nz(land,.28,'lowpass',380,70,.95*w,.6,brown,.003);                          // soft sponge thump
          nz(land,.12,'lowpass',1400,300,.22*w,.7,white,.003);                        // frosting squish
          nz(land+.05,.16,'bandpass',700,320,.07*w,.9)}                              // little settle
        else{[0,.09,.17].forEach(k=>{nz(land+k,.035,'bandpass',1800,900,.07,2)});}   // candles tap in
      }
      [0,.16,.3].forEach(k=>{const t=now+3.15+k;                                     // each candle lights
        for(let j=0;j<5;j++)nz(t+j*.035,.04,'bandpass',2600+Math.random()*1500,1800,.07,1.4);  // match scratch
        nz(t+.2,.5,'highpass',1500,5000,.1,.6,white,.12);                            // flare "fsshh"
        nz(t+.2,.45,'lowpass',600,160,.25,.6,brown,.08);                             // gas puff
        for(let c=0;c<6;c++)nz(t+.45+Math.random()*1.1,.02,'highpass',3500,8000,.035+Math.random()*.03,1)  // wax crackle
      });
      nz(now+3.6,1.6,'bandpass',2000,1500,.02,.4,white,.5);                          // gentle flame hush
    }};
})();

/* ---------- Opening: cake falls layer by layer ---------- */
const start=document.getElementById('start'),gift=document.getElementById('gift'),btn=document.getElementById('giftBtn');
let confetti=[],busy=true,timers=[];
const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
function playIntro(){
  try{Sfx.intro()}catch(e){}
  document.documentElement.classList.add('ready');
  start.classList.remove('settled');start.classList.remove('play');void start.offsetWidth;start.classList.add('play');later(()=>start.classList.add('settled'),4200);
  busy=true;later(()=>{busy=false},3900);
}
/* Browsers only allow sound after a tap, so a tiny start screen unlocks audio and then the cake falls */
(function(){
  const g=document.createElement('div');g.id='gate';
  g.innerHTML='<div><div class="gemoji">🥳🎂🥳</div><button id="goBtn">Tap To Start Your Celebration🥳🥰</button></div>';
  document.body.appendChild(g);document.documentElement.classList.add('ready');
  let went=false;
  function go(){if(went)return;went=true;Sfx.unlock();g.classList.add('gone');setTimeout(()=>g.remove(),800);playIntro();}
  g.addEventListener('click',go);
})();

/* ---------- Transition: 180° turn, city fly-by, then the next page ---------- */
let opening=false;
function tapGift(){
  if(opening)return;opening=true;                          // works any time, even during the cake intro
  try{btn.classList.add('shake');Music.start()}catch(e){}  // audio must start inside the tap
  later(open,600);
}
btn.addEventListener('click',tapGift);
btn.addEventListener('pointerup',tapGift);
let shown=false;
function showGift(){gift.classList.remove('off');if(!shown){shown=true;bearShow()}}
function bearShow(){                                       // bear walks in -> celebrates -> message appears
  const w=document.getElementById('bearWrap');
  gift.classList.add('in');w.classList.remove('jump');w.classList.add('walk');
  try{Sfx.steps()}catch(e){}
  later(()=>{w.classList.remove('walk');w.classList.add('jump');party();try{Sfx.hops()}catch(e){}},2300);
  later(()=>{w.classList.remove('jump');gift.classList.add('msgin')},4100);   // <- this line reveals the message
}
function forceGift(){                                       // last resort if transitions misbehave on a device
  showGift();gift.style.cssText='opacity:1;visibility:visible;transform:none';start.style.visibility='hidden';
}
function open(){
  try{applyGreeting()}catch(e){}
  document.body.classList.add('opened');   // camera glides along the city
  start.classList.add('off');              // opening page turns 180° and leaves
  later(showGift,3000);                    // city is shown first
  later(forceGift,5000);                   // safety: the wish page must appear
  later(()=>gift.classList.add('msgin'),9500);   // safety: the message must appear
}
function party(){
  const cols=['#ffe78a','#ff82d8','#9f8cff','#78eaff','#fff'];
  for(let i=0;i<70;i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';c.style.background=cols[i%5];
    c.style.animationDuration=(3+Math.random()*3)+'s';c.style.animationDelay=(Math.random()*2)+'s';
    document.body.appendChild(c);confetti.push(c);
  }
  later(clearConfetti,14000);
}
function clearConfetti(){confetti.forEach(c=>c.remove());confetti=[]}
function replay(){
  timers.forEach(clearTimeout);timers=[];clearConfetti();Music.stop();busy=true;gift.removeAttribute('style');start.removeAttribute('style');
  document.body.classList.remove('opened');
  gift.classList.add('off');gift.classList.remove('in','msgin');shown=false;   // turns back 180°
  const bw=document.getElementById('bearWrap');bw.classList.remove('walk','jump');
  later(()=>{applyGreeting();btn.classList.remove('shake');start.classList.remove('play');start.classList.remove('off');opening=false},2200);
  later(playIntro,3600);
}
const muteBtn=document.getElementById('muteBtn');
muteBtn.addEventListener('click',()=>{muteBtn.textContent=Music.toggle()?'🔇':'🎵'});
document.getElementById('replayBtn').addEventListener('click',replay);
</script>
